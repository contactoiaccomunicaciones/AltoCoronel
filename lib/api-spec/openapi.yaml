openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /inquiries:
    post:
      operationId: createInquiry
      summary: Register interest in AltoCoronel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InquiryInput"
      responses:
        "201":
          description: Inquiry registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InquiryResult"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    InquiryInput:
      type: object
      required: [name, email, phone, channel, consent]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, minLength: 8, maxLength: 25 }
        channel: { type: string, enum: [email, whatsapp] }
        message: { type: string, maxLength: 2000 }
        consent: { type: boolean, enum: [true] }
    InquiryResult:
      type: object
      required: [message]
      properties:
        message: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

